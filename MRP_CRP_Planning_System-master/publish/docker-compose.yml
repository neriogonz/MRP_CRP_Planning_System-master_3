version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: metallurgy_postgres
    environment:
      POSTGRES_DB: CRP_MRP_Planning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - metallurgy_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metallurgy_app
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=metallurgy_db;Username=postgres;Password=postgres_password_123
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - metallurgy_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  metallurgy_network:
    driver: bridge